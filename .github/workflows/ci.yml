name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: Backend Lint, Migrations & Test Suites
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: restaurant_app
          POSTGRES_PASSWORD: test_password_secure_123
          POSTGRES_DB: restaurant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r backend/requirements.txt

      - name: Run Ruff Lint
        run: |
          cd backend
          ruff check .

      - name: Verify Database Migrations (Upgrade -> Downgrade Base -> Re-Upgrade)
        env:
          DATABASE_URL: postgresql+asyncpg://restaurant_app:test_password_secure_123@127.0.0.1:5432/restaurant_test
          ENVIRONMENT: test
          JWT_SECRET_KEY: test_secret_key_minimum_32_bytes_long_abcdef0123456789
          CSRF_SECRET_KEY: test_csrf_secret_minimum_32_bytes_long_abcdef0123456789
        run: |
          cd backend
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          # The pytest integration fixture needs an EMPTY database (it upgrades by itself).
          alembic downgrade base

      - name: Run Pytest Suite
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://restaurant_app:test_password_secure_123@127.0.0.1:5432/restaurant_test
          ENVIRONMENT: test
          JWT_SECRET_KEY: test_secret_key_minimum_32_bytes_long_abcdef0123456789
          CSRF_SECRET_KEY: test_csrf_secret_minimum_32_bytes_long_abcdef0123456789
        run: |
          cd backend
          pytest -v --tb=short

  web-frontends-qa:
    name: Web Frontends Build & Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            customer-web/package.json
            admin-web/package.json

      - name: Customer Web - Install & Build
        run: |
          cd customer-web
          npm install
          npm run build

      - name: Admin Web - Install & Build
        run: |
          cd admin-web
          npm install
          npm run build

  mobile-apps-qa:
    name: Flutter Staff App Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      # waiter-app/ is now the single combined Staff App (Waiter + Kitchen).
      # kitchen-app/ is legacy and no longer built in CI.
      - name: Staff App (waiter-app) - Analyze & Test
        run: |
          cd waiter-app
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
